name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Dev
    paths:
      - 'Angular/**'
      - '.github/workflows/azure-static-web-apps-jolly-bay-071900b10.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - Dev
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install OIDC Client
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_BAY_071900B10 }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/Angular" 
          api_location: "" 
          output_location: "dist/tiny-url-app" 
          github_id_token: ${{ steps.idtoken.outputs.result }}