# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - app-tinyurl-6f730274

on:
  push:
    branches:
      - Dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Use '*' to find the solution file automatically
      - name: dotnet restore
        run: dotnet restore *.sln

      - name: Build with dotnet
        run: dotnet build *.sln --configuration Release --no-restore

      # Use '*' to find the project file automatically
      - name: dotnet publish
        # We output to a folder named 'publish' inside the runner
        run: dotnet publish *.csproj -c Release -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          # Points to the output folder we just created
          path: DotnetCore/TinyUrlBackend/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A0549289FDA547388689CBBDA9DCC5F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_06514D3D4E2849D6955070A987346712 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68AF89D06B254CD1AB2FE0634C67E3FE }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-tinyurl-6f730274'
          slot-name: 'Production'
          package: .net-app
          
