name: Build and deploy ASP.Net Core app to Azure Web App - app-tinyurl-6f730274

on:
  push:
    branches:
      - Dev
    paths:
      - 'DotnetCore/**'
      - '.github/workflows/dev_app-tinyurl-6f730274.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Create the EXACT folder structure Azure needs
      - name: Create Structure
        run: mkdir -p ./final_package/App_Data/jobs/triggered/TinyUrlCleanup

      # 2. Restore dependencies
      - name: dotnet restore
        run: |
          dotnet restore DotnetCore/TinyUrlBackend/TinyUrlBackend.csproj
          dotnet restore DotnetCore/TinyUrlCleanup/TinyUrlCleanup.csproj

      # 3. Publish Backend API (The Website)
      - name: Publish Backend API
        run: dotnet publish DotnetCore/TinyUrlBackend/TinyUrlBackend.csproj -c Release -o ./final_package

      # 4. Publish Cleanup WebJob (The Background Task)
      - name: Publish Cleanup WebJob
        run: |
          dotnet publish DotnetCore/TinyUrlCleanup/TinyUrlCleanup.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -f net8.0 \
            -o ./final_package/App_Data/jobs/triggered/TinyUrlCleanup

      # 5. AUTO-GENERATE DEPLOYMENT SCRIPTS (The Magic Fix)
      # This ensures run.sh and settings.job (Timer) are always present
      - name: Generate WebJob Scripts
        run: |
          echo "dotnet TinyUrlCleanup.dll" > ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/run.sh
          echo '{"schedule": "0 */1 * * * *", "is_in_place": true}' > ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/settings.job
          chmod +x ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/run.sh

      # 6. Verify Artifact Structure (Check your GitHub Action logs for this!)
      - name: Verify Artifact Structure
        run: |
          echo "--- API Files Found ---"
          ls ./final_package
          echo "--- WebJob Folder Check ---"
          ls -R ./final_package/App_Data/jobs/triggered/TinyUrlCleanup

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyurl-full-package
          path: ./final_package/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tinyurl-full-package
          path: ./deployment_dir

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A0549289FDA547388689CBBDA9DCC5F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_06514D3D4E2849D6955070A987346712 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68AF89D06B254CD1AB2FE0634C67E3FE }}

      # 7. Deploy the content to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-tinyurl-6f730274'
          package: ./deployment_dir