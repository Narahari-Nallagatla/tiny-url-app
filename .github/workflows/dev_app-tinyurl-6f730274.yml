name: Build and deploy ASP.Net Core app to Azure Web App - app-tinyurl-6f730274

on:
  push:
    branches:
      - Dev
    paths:
      - 'DotnetCore/**'
      - '.github/workflows/dev_app-tinyurl-6f730274.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Create a specific staging area for the final package
      - name: Create Staging Directory
        run: mkdir -p ./publish_staging/App_Data/jobs/triggered/TinyUrlCleanup

      # 2. Restore dependencies for the projects
      - name: dotnet restore
        run: |
          dotnet restore DotnetCore/TinyUrlBackend/TinyUrlBackend.csproj
          dotnet restore DotnetCore/TinyUrlCleanup/TinyUrlCleanup.csproj

      # 3. Publish the Backend API to the root of the staging folder
      - name: Publish Backend API
        run: dotnet publish DotnetCore/TinyUrlBackend/TinyUrlBackend.csproj -c Release -o ./publish_staging

      # 4. Publish the Cleanup WebJob to the required Azure subfolder
      - name: Publish Cleanup WebJob
        run: |
          dotnet publish DotnetCore/TinyUrlCleanup/TinyUrlCleanup.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -f net8.0 \
            -o ./publish_staging/App_Data/jobs/triggered/TinyUrlCleanup

      # 5. Verification step: Print the folder structure to the GitHub logs
      - name: Verify Artifact Structure
        run: |
          echo "--- Root Level (API) ---"
          ls ./publish_staging
          echo "--- WebJob Level ---"
          ls ./publish_staging/App_Data/jobs/triggered/TinyUrlCleanup

      # 6. Upload everything in publish_staging as one artifact
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish_staging

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish_staging
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A0549289FDA547388689CBBDA9DCC5F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_06514D3D4E2849D6955070A987346712 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68AF89D06B254CD1AB2FE0634C67E3FE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-tinyurl-6f730274'
          package: ./publish_staging