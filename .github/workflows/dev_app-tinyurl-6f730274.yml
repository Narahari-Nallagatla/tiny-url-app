name: Build and deploy ASP.Net Core app to Azure Web App - app-tinyurl-6f730274

on:
  push:
    branches:
      - Dev
    paths:
      - 'DotnetCore/**'
      - '.github/workflows/dev_app-tinyurl-6f730274.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Restore for the whole solution to ensure dependencies are mapped
      - name: dotnet restore
        run: dotnet restore DotnetCore/TinyUrlBackend/TinyUrlBackend.csproj

      # 2. Publish Backend API to the root of the output folder
      - name: dotnet publish Backend
        run: dotnet publish DotnetCore/TinyUrlBackend/TinyUrlBackend.csproj -c Release -o ./output        

      # 3. Publish Cleanup WebJob into the specific App_Data path within the same output folder
      # Using -f net8.0 and -r linux-x64 to ensure environment compatibility
      - name: Build and Publish Cleanup WebJob
        run: |
          dotnet publish DotnetCore/TinyUrlCleanup/TinyUrlCleanup.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -f net8.0 \
            -o ./output/App_Data/jobs/triggered/TinyUrlCleanup
          
      # 4. Upload the combined artifact (API + WebJob)
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./output

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./output
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A0549289FDA547388689CBBDA9DCC5F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_06514D3D4E2849D6955070A987346712 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68AF89D06B254CD1AB2FE0634C67E3FE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-tinyurl-6f730274'
          package: ./output