name: Build and deploy ASP.Net Core app to Azure Web App - app-tinyurl-6f730274

on:
  push:
    branches:
      - Dev
    paths:
      - 'DotnetCore/**'
      - '.github/workflows/dev_app-tinyurl-6f730274.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Create the clean staging directory
      - name: Create Structure
        run: mkdir -p ./final_package/App_Data/jobs/triggered/TinyUrlCleanup

      # 2. Restore all projects
      - name: dotnet restore
        run: dotnet restore **/DotnetCore/**/*.csproj

      # 3. Publish the Website (The Main API)
      - name: Publish Backend API
        run: |
          dotnet publish DotnetCore/TinyUrlBackend/TinyUrlBackend.csproj \
            -c Release \
            --no-restore \
            -o ./final_package

      # 4. Publish the WebJob (The Cleanup Task)
      # We use --no-restore because we did it in step 2. 
      # We output directly into the specific WebJobs subfolder.
      - name: Publish Cleanup WebJob
        run: |
          dotnet publish DotnetCore/TinyUrlCleanup/TinyUrlCleanup.csproj \
            -c Release \
            -f net8.0 \
            --no-restore \
            -o ./final_package/App_Data/jobs/triggered/TinyUrlCleanup

      # 5. Generate Startup Script and Timer
      # CRITICAL: This fixes the 'Manual' status and the 'Run' button issues.
      - name: Generate WebJob Metadata
        run: |
          echo "#!/bin/bash" > ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/run.sh
          echo "dotnet TinyUrlCleanup.dll" >> ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/run.sh
          echo '{"schedule": "0 */1 * * * *", "is_in_place": true}' > ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/settings.job
          chmod +x ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/run.sh

      # 6. Verification (Check this in your GitHub Action Logs)
      - name: Verify Package Contents
        run: |
          echo "--- Checking for Serilog and DLLs ---"
          ls ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/
          echo "--- Checking run.sh content ---"
          cat ./final_package/App_Data/jobs/triggered/TinyUrlCleanup/run.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyurl-full-package
          path: ./final_package/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tinyurl-full-package
          path: ./deployment_dir

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A0549289FDA547388689CBBDA9DCC5F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_06514D3D4E2849D6955070A987346712 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_68AF89D06B254CD1AB2FE0634C67E3FE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-tinyurl-6f730274'
          package: ./deployment_dir